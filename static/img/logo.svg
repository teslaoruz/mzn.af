<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Mizan "Counter Seal" mark (0.9.x identity — chosen design direction): a solid ledger-green
       disc with the balance/scale knocked out in warm paper. Reads coin-like and stamps cleanly
       down to a 16px favicon.
       Single-source logo pipeline (0.8.0 wave 6.4): drop a replacement SVG here, run
       src/Tools/LogoGen, rebuild — every surface (desktop, installer, keygen, phone) updates.
       keygen.svg / phone.svg override per surface; a missing variant falls back to this file. -->
  <circle cx="256" cy="256" r="240" fill="#1B5E20"/>
  <g fill="none" stroke="#FAF8F4" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- central column + beam + base -->
    <path d="M256 128 V368"/>
    <path d="M144 176 H368"/>
    <path d="M200 384 H312"/>
    <!-- suspension lines to the two pans -->
    <path d="M144 176 l-40 80 M144 176 l40 80 M368 176 l-40 80 M368 176 l40 80"/>
  </g>
  <!-- pans (bowls) + top knob, filled paper -->
  <path d="M88 256 a56 40 0 0 0 112 0 z" fill="#FAF8F4"/>
  <path d="M312 256 a56 40 0 0 0 112 0 z" fill="#FAF8F4"/>
  <circle cx="256" cy="120" r="20" fill="#FAF8F4"/>
</svg>
